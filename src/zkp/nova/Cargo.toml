[package]
name = "nova-scotia"
version = "0.5.0"
edition = "2021"
authors = ["Nalin <novascotia@nibnalin.me>"]
description = "Middleware to compile Circom circuits to Nova zkSNARK scheme"
documentation = "https://github.com/nalinbhardwaj/Nova-Scotia/blob/main/README.md"
readme = "README.md"
repository = "https://github.com/nalinbhardwaj/Nova-Scotia"
license-file = "LICENSE"
keywords = ["zkSNARKs", "cryptography", "proofs"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.65"
bellperson = { version = "0.25", default-features = false }
byteorder = "1.4.3"
ff = { version = "0.13", features = ["derive"]}
hex-literal = "0.3.4"
itertools = "0.9.0"
nova-snark = "0.23.0"
num-bigint = { version = "0.4", features = ["serde", "rand"] }
num-traits = "0.2.15"
pasta_curves = "0.5"
# serde = "1.0"
serde_json = "1.0.85"
flate2 = "1.0.35"
bincode = "1.3.3"

sha2 = "0.10.8"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde-pickle = "1.2.0"

poseidon-rs = "0.0.10"
ark-ff = { version = "^0.4.0", default-features = true }
ark-bn254 = { version = "^0.4.0", features = ["curve"] }
ark-std = { version = "^0.4.0" }
ark-crypto-primitives = { version = "^0.3.0", default-features = true, features = [ "r1cs" ] }
ark-ed-on-bn254 = { version = "^0.3.0", default-features = true, features = [ "r1cs" ] }
# hex = { version = "0.4", default-features = false }
halo2_gadgets = { git = "https://github.com/zkonduit/halo2", branch= "ac/parallel-lookup-permute", default_features = false }
halo2_proofs = { git = "https://github.com/zkonduit/halo2", branch= "ac/parallel-lookup-permute", default_features = false }

primitive-types = "0.12.1"
rayon = { version = "1.7.0",  default_features = false }
halo2curves = { version = "0.1.0" }
rand_core = { version = "0.6", default-features = false }
rand = { version = "0.8", default_features = false }
clap = { version = "4.3.3", features = ["derive"]}



[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = { version = "0.2.81", features = ["serde-serialize"]}
rayon = "1.5"
wasm-bindgen-rayon = { version = "1.0"}
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[features]
default = []
cuda = ["nova-snark/cuda"]
opencl = ["nova-snark/opencl"]
